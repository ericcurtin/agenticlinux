name: Build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  IMAGE: docker.io/${{ vars.DOCKER_HUB_USER }}/agenticlinux
  FEDORA: 44

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      variants: ${{ steps.out.outputs.variants }}
    steps:
      - id: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$FEDORA.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo 'variants=["kinoite","silverblue","sway-atomic","cosmic-atomic","xfce-atomic","budgie-atomic","base-atomic"]' >> "$GITHUB_OUTPUT"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$tag" --notes "Images: https://hub.docker.com/r/${{ vars.DOCKER_HUB_USER }}/agenticlinux/tags?name=$tag

          ISOs larger than 2 GiB are split; reassemble with
          \`cat agenticlinux-<variant>-<arch>.iso.part* > agenticlinux-<variant>-<arch>.iso\`
          and verify against the .sha256 file."

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VARIANT=${{ matrix.variant }}
            FEDORA=${{ env.FEDORA }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
      - run: |
          mkdir digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ runner.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - env:
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          name="${VARIANT%-atomic}"
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMAGE:$name" -t "$IMAGE:$name-$TAG" \
            $(printf "$IMAGE@sha256:%s " $(ls digests))

  iso:
    needs: [setup, manifest]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          df -h /
      - name: Build ISO
        env:
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          name="${VARIANT%-atomic}"
          image="$IMAGE:$name-$TAG"
          mkdir output
          docker run --rm --privileged -v ./output:/output -v /var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso "$image"
          iso="agenticlinux-$name-$(uname -m).iso"
          sudo mv output/bootiso/install.iso "$iso"
          sha256sum "$iso" > "$iso.sha256"
          # GitHub release assets are limited to 2 GiB
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            rm "$iso"
          fi
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" agenticlinux-*

  publish:
    needs: [setup, iso]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
