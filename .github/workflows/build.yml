name: Build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  IMAGE: docker.io/${{ vars.DOCKER_HUB_USER }}/agenticlinux
  FEDORA: 44
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

# A newer push supersedes whatever is running: nothing is published until the
# whole run is green, so a half-finished run of an older commit has no value,
# and without this every push queues behind the previous run for hours.
concurrency:
  group: build
  cancel-in-progress: true

# Both architectures are smoke-tested in containers; x86_64 additionally in
# hardware-accelerated VMs. aarch64 is not boot-tested: no GitHub-hosted arm64
# runner can run a VM (Linux arm64 has no /dev/kvm, macOS arm64 no HVF,
# Windows arm64 no Hyper-V VMs) and emulation is not an option. Nothing is
# published for either architecture unless every build and test is green.
#
# The agent turns on a local model run in the KVM and WHPX guests only; the
# HVF guests on the Intel macOS runners are 5-10x slower.
jobs:
  # The variants are named after their desktop; that is also the public tag and
  # the ISO name. "bases" maps each onto the upstream image it is built from
  # (Dockerfile VARIANT); build.sh has the same table for the OS identity.
  setup:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      variants: ${{ steps.out.outputs.variants }}
      bases: ${{ steps.out.outputs.bases }}
    steps:
      - id: out
        run: |
          echo "tag=$FEDORA.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo 'variants=["kde","gnome","sway","cosmic","xfce","budgie","base"]' >> "$GITHUB_OUTPUT"
          echo 'bases={"kde":"kinoite","gnome":"silverblue","sway":"sway-atomic","cosmic":"cosmic-atomic","xfce":"xfce-atomic","budgie":"budgie-atomic","base":"base-atomic"}' >> "$GITHUB_OUTPUT"

  # Build each variant natively and run the smoke test in a container of it;
  # on x86_64 also install it into a qcow2 and boot it under KVM for the full
  # test. Nothing is pushed yet; the image is handed on as an artifact.
  build:
    needs: setup
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space, use the containerd image store
        # overlay2 refuses images with more than ~125 layers; Fedora's have more
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VARIANT=${{ fromJSON(needs.setup.outputs.bases)[matrix.variant] }}
            FEDORA=${{ env.FEDORA }}
            REPO_URL=${{ env.REPO_URL }}
          tags: agenticlinux:${{ matrix.variant }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}-${{ runner.arch }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 1
      - name: Smoke test in a container
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          rm "$RUNNER_TEMP/image.tar"
          docker buildx prune -af
          docker build -f test/Dockerfile --build-arg "IMAGE=agenticlinux:$VARIANT" -t agenticlinux:smoke .
          docker run --rm agenticlinux:smoke smoke-vm
      - if: runner.arch == 'X64'
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-utils
          sudo chmod a+rw /dev/kvm
      - if: runner.arch == 'X64'
        name: Install into a qcow2
        # bootc reads the image straight from the OCI layout and writes to the
        # qcow2 through qemu-nbd. no_timer_check: the kernel's IO-APIC timer
        # sanity test wants five PIT ticks within a short delay run before the
        # TSC is calibrated, and a loaded HVF host has missed that and panicked
        # 16 ms into boot (the kernel skips the test itself on every hypervisor
        # it recognizes, KVM, Hyper-V and VMware, but sees HVF as bare metal).
        env:
          VARIANT: ${{ matrix.variant }}
          BOOTC: quay.io/fedora/fedora-bootc:${{ env.FEDORA }}
        run: |
          mkdir oci && docker save agenticlinux:smoke | tar x -C oci
          # The image is in the artifact and in oci now. Everything Docker
          # still holds (the loaded image, its unpacked snapshots, the smoke
          # build's cache) shares the disk with the qcow2, which grows by the
          # whole installed system as bootc writes it through qemu-nbd.
          docker system prune -af
          df -h /
          # Patient retries, as in build.sh: quay.io has answered 502 mid-pull,
          # and docker run's own implicit pull is a single attempt
          for i in $(seq 12); do docker pull "$BOOTC" && break || sleep 20; done
          sudo modprobe nbd max_part=16
          install_disk() {
            qemu-img create -f qcow2 disk.qcow2 60G
            sudo qemu-nbd --fork -c /dev/nbd0 disk.qcow2
            local status=0
            docker run --rm --privileged --pid=host -v /dev:/dev -v "$PWD/oci:/oci:ro" \
              -v "$PWD/usr/lib/bootc/install:/usr/lib/bootc/install:ro" \
              "$BOOTC" \
              bootc install to-disk --source-imgref oci:/oci \
              --target-imgref "$IMAGE:$VARIANT" --generic-image --skip-fetch-check \
              --karg systemd.run=/usr/bin/smoke-vm --karg systemd.run_success_action=poweroff \
              --karg systemd.run_failure_action=poweroff --karg console=ttyS0 --karg console=ttyAMA0 \
              --karg no_timer_check \
              /dev/nbd0 || status=$?
            if [ "$status" -ne 0 ]; then
              # What the failure looked like from each side of the nbd
              # device: the host's disk, the kernel's view of nbd and xfs,
              # and how full the target filesystem actually was
              df -h /
              sudo dmesg | grep -iE 'nbd|xfs|i/o error' | tail -n 30 || true
              sudo mkdir -p /mnt/target
              sudo mount -o ro,norecovery /dev/nbd0p3 /mnt/target && df -h /mnt/target &&
                sudo umount /mnt/target || true
            fi
            sudo qemu-nbd -d /dev/nbd0
            return "$status"
          }
          # The install has failed with "No space left on device" from the
          # target filesystem four minutes in, for an image that installs
          # into well under half of the 60 GB disk, while the same step passed
          # for larger variants in the same run and for the same variant in
          # the runs around it. Nothing about it is deterministic, so a failed
          # install is retried once on a fresh disk after the diagnostics.
          if ! install_disk; then
            rm -f disk.qcow2
            install_disk
          fi
          sudo rm -rf oci
          df -h /
      - if: runner.arch == 'X64'
        name: Boot and smoke test
        run: test/smoke.sh disk.qcow2
      # The guest wrote to an overlay, so this is the disk as installed, the
      # one the test just booted. The checksum lets the smoke jobs tell a
      # damaged download from a boot failure (10 GB per disk).
      - if: runner.arch == 'X64'
        run: |
          qemu-img convert -c -O qcow2 -o compression_type=zstd disk.qcow2 vm.qcow2
          mv vm.qcow2 disk.qcow2
          sha256sum disk.qcow2 > disk.qcow2.sha256
      - if: runner.arch == 'X64'
        uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.variant }}
          path: |
            disk.qcow2
            disk.qcow2.sha256
          compression-level: 0
          retention-days: 1

  # Boot the same disks on the other hosts with hardware virtualization.
  # Budget: artifact download, one retried boot hang, smoke.sh's own timeout.
  smoke:
    needs: [setup, build]
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vm-${{ matrix.variant }}
      - name: Verify the disk arrived intact
        shell: bash
        # macOS has no sha256sum; its shasum reads the same file format
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c disk.qcow2.sha256
          else shasum -a 256 -c disk.qcow2.sha256; fi
      - if: runner.os == 'macOS'
        run: brew install qemu
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install -y --no-progress qemu
          echo 'C:\Program Files\qemu' >> "$GITHUB_PATH"
      - shell: bash
        env:
          SMOKE_INFERENCE: ${{ runner.os != 'macOS' && '1' || '0' }}
        run: test/smoke.sh disk.qcow2 x86_64
      # The step above prints only the tail of the guest's console; smoke.sh
      # keeps one console and one qemu stderr log per boot attempt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.variant }}-${{ matrix.runner }}
          path: |
            serial.*.log
            qemu.*.log
          retention-days: 7

  # Every build and smoke test passed: publish both architectures to Docker Hub.
  push:
    needs: [setup, build, smoke]
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space, use the containerd image store
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/download-artifact@v4
        with:
          pattern: image-${{ matrix.variant }}-*
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - env:
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for arch in X64:x86_64 ARM64:aarch64; do
            docker load -i "image-$VARIANT-${arch%:*}/image.tar"
            docker tag "agenticlinux:$VARIANT" "$IMAGE:$VARIANT-$TAG-${arch#*:}"
            docker push "$IMAGE:$VARIANT-$TAG-${arch#*:}"
            docker rmi "agenticlinux:$VARIANT" "$IMAGE:$VARIANT-$TAG-${arch#*:}"
          done
          docker buildx imagetools create -t "$IMAGE:$VARIANT" -t "$IMAGE:$VARIANT-$TAG" \
            "$IMAGE:$VARIANT-$TAG-x86_64" "$IMAGE:$VARIANT-$TAG-aarch64"

  # GitHub Releases answers 500 now and then (an ISO upload has failed with
  # "Error saving asset" after 15 minutes of transfer, on eight of fourteen
  # ISOs in one run), so every call to it below is retried. The retries are
  # idempotent: create checks for the release first, upload clobbers.
  release:
    needs: [setup, push]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          NOTES: |
            Images: https://hub.docker.com/r/${{ vars.DOCKER_HUB_USER }}/agenticlinux/tags?name=${{ needs.setup.outputs.tag }}

            The ISOs are network installers that install the matching image from
            Docker Hub, so they need a network connection during install.

            AgenticLinux is an independent community build. It is not affiliated
            with, endorsed by or supported by the Fedora Project or Red Hat, Inc.
            Fedora is a trademark of Red Hat, Inc.
        run: |
          for i in $(seq 5); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes "$NOTES" && break
            [ "$i" -lt 5 ] || exit 1
            sleep 60
          done

  iso:
    needs: [setup, release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO
        env:
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          iso="agenticlinux-$VARIANT-$(uname -m).iso"
          for i in $(seq 12); do docker pull fedora:${{ env.FEDORA }} && break || sleep 20; done
          docker run --rm -v "$PWD:/w" -w /w -e REPO_URL fedora:${{ env.FEDORA }} \
            iso/build.sh "$IMAGE:$VARIANT-$TAG" "$VARIANT" "/w/$iso"
          sha256sum "$iso" > "$iso.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for i in $(seq 5); do
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber agenticlinux-* && break
            [ "$i" -lt 5 ] || exit 1
            sleep 60
          done

  publish:
    needs: [setup, iso]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for i in $(seq 5); do
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest && break
            [ "$i" -lt 5 ] || exit 1
            sleep 60
          done
