name: Build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  IMAGE: docker.io/${{ vars.DOCKER_HUB_USER }}/agenticlinux
  FEDORA: 44

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      variants: ${{ steps.out.outputs.variants }}
    steps:
      - id: out
        run: |
          echo "tag=$FEDORA.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo 'variants=["kinoite","silverblue","sway-atomic","cosmic-atomic","xfce-atomic","budgie-atomic","base-atomic"]' >> "$GITHUB_OUTPUT"

  # Build each variant natively, boot it in a VM and run the smoke test.
  # Nothing is pushed anywhere yet; the image is handed on as an artifact.
  build:
    needs: setup
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space, use the containerd image store
        # overlay2 refuses images with more than ~125 layers; Fedora's have more
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VARIANT=${{ matrix.variant }}
            FEDORA=${{ env.FEDORA }}
          tags: agenticlinux:${{ matrix.variant }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}-${{ runner.arch }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 1
      - name: Load image
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          rm "$RUNNER_TEMP/image.tar"
          docker buildx prune -af
      - name: Install into a disk image
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker build -f test/Dockerfile --build-arg "IMAGE=agenticlinux:$VARIANT" -t agenticlinux:smoke .
          truncate -s 30G disk.raw
          docker run --rm --privileged --pid=host -v /dev:/dev \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/vm" agenticlinux:smoke \
            bootc install to-disk --via-loopback --source-imgref docker-daemon:agenticlinux:smoke \
            --target-imgref "$IMAGE:${VARIANT%-atomic}" --generic-image --skip-fetch-check \
            --karg systemd.run=/usr/bin/smoke-vm --karg systemd.run_success_action=poweroff \
            --karg systemd.run_failure_action=poweroff --karg console=ttyS0 --karg console=ttyAMA0 \
            /vm/disk.raw
          sudo chown "$USER" disk.raw
      - name: Boot and smoke test
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-utils
          [ -e /dev/kvm ] && sudo chmod a+rw /dev/kvm
          test/smoke.sh disk.raw
      - if: runner.arch == 'X64'
        run: qemu-img convert -c -O qcow2 -o compression_type=zstd disk.raw disk.qcow2
      - if: runner.arch == 'X64'
        uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.variant }}
          path: disk.qcow2
          compression-level: 0
          retention-days: 1

  # Boot the x86_64 disks on the other hosts with hardware virtualization.
  # Linux arm64, macOS arm64 and Windows arm64 runners have none.
  smoke:
    needs: [setup, build]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vm-${{ matrix.variant }}
      - if: runner.os == 'macOS'
        run: brew install qemu
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install -y --no-progress qemu
          echo 'C:\Program Files\qemu' >> "$GITHUB_PATH"
      - shell: bash
        run: test/smoke.sh disk.qcow2 x86_64

  # Everything passed: publish the images to Docker Hub.
  push:
    needs: [setup, build, smoke]
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space, use the containerd image store
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/download-artifact@v4
        with:
          pattern: image-${{ matrix.variant }}-*
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - env:
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          name="${VARIANT%-atomic}"
          for arch in X64:x86_64 ARM64:aarch64; do
            docker load -i "image-$VARIANT-${arch%:*}/image.tar"
            docker tag "agenticlinux:$VARIANT" "$IMAGE:$name-$TAG-${arch#*:}"
            docker push "$IMAGE:$name-$TAG-${arch#*:}"
            docker rmi "agenticlinux:$VARIANT" "$IMAGE:$name-$TAG-${arch#*:}"
          done
          docker buildx imagetools create -t "$IMAGE:$name" -t "$IMAGE:$name-$TAG" \
            "$IMAGE:$name-$TAG-x86_64" "$IMAGE:$name-$TAG-aarch64"

  release:
    needs: [setup, push]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Images: https://hub.docker.com/r/${{ vars.DOCKER_HUB_USER }}/agenticlinux/tags?name=$TAG

          ISOs larger than 2 GiB are split; reassemble with
          \`cat agenticlinux-<variant>-<arch>.iso.part* > agenticlinux-<variant>-<arch>.iso\`
          and verify against the .sha256 file."

  iso:
    needs: [setup, release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          df -h /
      - name: Build ISO
        env:
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          name="${VARIANT%-atomic}"
          image="$IMAGE:$name-$TAG"
          mkdir output
          # bootc-image-builder only reads containers-storage, so seed it with skopeo first
          docker run --rm --privileged -v ./output:/output -v /var/lib/containers/storage \
            --entrypoint sh quay.io/centos-bootc/bootc-image-builder:latest -c \
            "mkdir -p /var/lib/containers/storage/overlay && \
             skopeo copy docker://$image containers-storage:$image && \
             bootc-image-builder --type anaconda-iso $image"
          iso="agenticlinux-$name-$(uname -m).iso"
          sudo mv output/bootiso/install.iso "$iso"
          sha256sum "$iso" > "$iso.sha256"
          # GitHub release assets are limited to 2 GiB
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            rm "$iso"
          fi
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" agenticlinux-*

  publish:
    needs: [setup, iso]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
