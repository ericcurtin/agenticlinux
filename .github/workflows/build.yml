name: Build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  IMAGE: docker.io/${{ vars.DOCKER_HUB_USER }}/agenticlinux
  FEDORA: 44
  CENTOS: 10
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
  # Docker's overlay2 store refuses images of over 125 layers ("max depth
  # exceeded"); this leaves 25 for images built on ours
  LAYER_LIMIT: 100

# A newer push supersedes whatever is running: nothing is published until the
# whole run is green, so a half-finished run of an older commit has no value,
# and without this every push queues behind the previous run for hours.
concurrency:
  group: build
  cancel-in-progress: true

# Both architectures are smoke-tested in containers; x86_64 additionally in
# hardware-accelerated VMs. aarch64 is not boot-tested: no GitHub-hosted arm64
# runner can run a VM (Linux arm64 has no /dev/kvm, macOS arm64 no HVF,
# Windows arm64 no Hyper-V VMs) and emulation is not an option. Nothing is
# published for either architecture unless every build and test is green.
#
# The agent turns on a local model run in the KVM and WHPX guests only; the
# HVF guests on the Intel macOS runners are 5-10x slower.
jobs:
  # The variants are named after their desktop, prefixed with the distribution
  # unless that is Fedora; that is also the public tag and the ISO name.
  # "bases" maps each onto the upstream bootc image it is built from
  # (Dockerfile BASE): Fedora's desktop images, or CentOS Stream's one image,
  # which has no desktop, so build.sh installs it. build.sh has the same table
  # for the OS identity.
  setup:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      variants: ${{ steps.out.outputs.variants }}
      bases: ${{ steps.out.outputs.bases }}
    steps:
      - id: out
        run: |
          echo "tag=$FEDORA.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo 'variants=["kde","gnome","sway","cosmic","xfce","budgie","base","centos-kde","centos-gnome","centos-base"]' >> "$GITHUB_OUTPUT"
          f=quay.io/fedora-ostree-desktops c=quay.io/centos-bootc/centos-bootc:stream$CENTOS
          bases=$(printf '"%s":"%s",' \
            kde "$f/kinoite:$FEDORA" gnome "$f/silverblue:$FEDORA" sway "$f/sway-atomic:$FEDORA" \
            cosmic "$f/cosmic-atomic:$FEDORA" xfce "$f/xfce-atomic:$FEDORA" budgie "$f/budgie-atomic:$FEDORA" \
            base "$f/base-atomic:$FEDORA" centos-kde "$c" centos-gnome "$c" centos-base "$c")
          echo "bases={${bases%,}}" >> "$GITHUB_OUTPUT"

  # Build each variant natively and run the smoke test in a container of it;
  # on x86_64 also install it into a qcow2 and boot it under KVM for the full
  # test. Nothing is pushed yet; the image (the Dockerfile's chunked target,
  # an OCI layout) is handed on as an artifact.
  build:
    needs: setup
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space, use the containerd image store
        # overlay2's docker load doesn't take an OCI layout
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: chunked
          build-args: |
            BASE=${{ fromJSON(needs.setup.outputs.bases)[matrix.variant] }}
            RECHUNKER=quay.io/fedora/fedora-bootc:${{ env.FEDORA }}
            VARIANT=${{ matrix.variant }}
            VERSION=${{ needs.setup.outputs.tag }}
            REPO_URL=${{ env.REPO_URL }}
          # Attestations would land in the OCI layout as stray files
          provenance: false
          sbom: false
          outputs: type=tar,dest=${{ runner.temp }}/image.tar
      # The checksum lets the push job tell a lost download from a bad image
      - run: cd "$RUNNER_TEMP" && sha256sum image.tar > image.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/image.tar.sha256
          compression-level: 0
          retention-days: 1
      - name: Smoke test in a container
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          rm "$RUNNER_TEMP/image.tar"
          layers=$(docker image inspect --format '{{len .RootFS.Layers}}' "agenticlinux:$VARIANT")
          echo "$layers layers"
          if [ "$layers" -gt "$LAYER_LIMIT" ]; then
            echo "::error::agenticlinux:$VARIANT has $layers layers, more than $LAYER_LIMIT"
            exit 1
          fi
          docker buildx prune -af
          docker build -f test/Dockerfile --build-arg "IMAGE=agenticlinux:$VARIANT" -t agenticlinux:smoke .
          docker run --rm agenticlinux:smoke smoke-vm
      - if: runner.arch == 'X64'
        # The runner image's package lists are as old as the image, and the
        # mirror drops a .deb as soon as noble-updates replaces it, so an
        # install against those lists has 404'd (every x86_64 job of one run,
        # on qemu's gstreamer Recommends). Refresh the lists first; skip the
        # Recommends, which are audio and GUI, so only what the tests use is
        # fetched: qemu, its tools and the OVMF firmware smoke.sh boots with.
        run: |
          for i in 1 2 3; do
            sudo apt-get update &&
              sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf && break
            [ "$i" -lt 3 ] || exit 1
            sleep 30
          done
          sudo chmod a+rw /dev/kvm
      - if: runner.arch == 'X64'
        name: Install into a qcow2
        # A normal install takes 8-15 minutes; this bounds one that hangs
        # past its own timeout below (two attempts, plus the save and pull)
        timeout-minutes: 90
        # bootc reads the image straight from the OCI layout and writes to a
        # sparse raw file through a loop device, which is then converted to
        # the qcow2 the later steps boot and hand on. No qemu-nbd: with it the
        # kernel's writeback of the target filesystem waits on a userspace
        # process that is itself writing to the host's disk, and the install
        # has hung there (gnome, 57 minutes in a step that takes 8-15, until
        # the runner stopped answering: "the hosted runner lost communication
        # with the server", no log kept). The loop driver does that writeback
        # inside the kernel, exempt from the dirty-page throttling that lets
        # the nbd server stall behind the very pages it is meant to write.
        # no_timer_check: the kernel's IO-APIC timer
        # sanity test wants five PIT ticks within a short delay run before the
        # TSC is calibrated, and a loaded HVF host has missed that and panicked
        # 16 ms into boot (the kernel skips the test itself on every hypervisor
        # it recognizes, KVM, Hyper-V and VMware, but sees HVF as bare metal).
        # The installer runs from the distribution's own bootc image.
        env:
          VARIANT: ${{ matrix.variant }}
          BOOTC: ${{ startsWith(matrix.variant, 'centos-') && format('quay.io/centos-bootc/centos-bootc:stream{0}', env.CENTOS) || format('quay.io/fedora/fedora-bootc:{0}', env.FEDORA) }}
        run: |
          mkdir oci && docker save agenticlinux:smoke | tar x -C oci
          # The image is in the artifact and in oci now. Everything Docker
          # still holds (the loaded image, its unpacked snapshots, the smoke
          # build's cache) shares the disk with the raw file, which grows by
          # the whole installed system as bootc writes it.
          docker system prune -af
          df -h /
          # Patient retries, as in build.sh: quay.io has answered 502 mid-pull,
          # and docker run's own implicit pull is a single attempt
          for i in $(seq 12); do docker pull "$BOOTC" && break || sleep 20; done
          install_disk() {
            rm -f disk.raw
            truncate -s 60G disk.raw
            local status=0
            # docker run passes timeout's SIGTERM on to bootc; a container
            # that outlives it is removed below
            timeout -k 2m 30m docker run --rm --name bootc-install --privileged --pid=host \
              -v /dev:/dev -v "$PWD/oci:/oci:ro" -v "$PWD/disk.raw:/disk.raw" \
              -v "$PWD/usr/lib/bootc/install:/usr/lib/bootc/install:ro" \
              "$BOOTC" \
              bootc install to-disk --via-loopback --source-imgref oci:/oci \
              --target-imgref "$IMAGE:$VARIANT" --generic-image --skip-fetch-check \
              --karg systemd.run=/usr/bin/smoke-vm --karg systemd.run_success_action=poweroff \
              --karg systemd.run_failure_action=poweroff --karg console=ttyS0 --karg console=ttyAMA0 \
              --karg no_timer_check \
              /disk.raw || status=$?
            if [ "$status" -ne 0 ]; then
              [ "$status" -ne 124 ] || echo "the install did not finish within 30 minutes"
              docker rm -f bootc-install >/dev/null 2>&1 || true
              # What the failure looked like from each side of the loop
              # device: the host's disk, the kernel's view of loop and xfs
              # (and of any task stuck on them), and how full the target
              # filesystem actually was
              df -h /
              sudo dmesg | grep -iE 'loop|xfs|i/o error|blocked for more' | tail -n 30 || true
              for dev in $(sudo losetup --list -n -O NAME -j disk.raw); do
                sudo losetup -d "$dev" || true
              done
              if dev=$(sudo losetup -P --find --show disk.raw); then
                sudo mkdir -p /mnt/target
                sudo mount -o ro,norecovery "${dev}p3" /mnt/target && df -h /mnt/target &&
                  sudo umount /mnt/target || true
                sudo losetup -d "$dev" || true
              fi
            fi
            return "$status"
          }
          # The install has failed with "No space left on device" from the
          # target filesystem four minutes in, for an image that installs
          # into well under half of the 60 GB disk, while the same step passed
          # for larger variants in the same run and for the same variant in
          # the runs around it (through qemu-nbd, as was the hang above).
          # Nothing about it is deterministic, so a failed or timed-out
          # install is retried once on a fresh disk after the diagnostics.
          install_disk || install_disk
          # bootc trimmed the filesystem, so the raw file is sparse; the
          # conversion skips its holes
          qemu-img convert -O qcow2 disk.raw disk.qcow2
          rm disk.raw
          sudo rm -rf oci
          df -h /
      - if: runner.arch == 'X64'
        name: Boot and smoke test
        run: test/smoke.sh disk.qcow2
      # The guest wrote to an overlay, so this is the disk as installed, the
      # one the test just booted. The checksum lets the smoke jobs tell a
      # damaged download from a boot failure (10 GB per disk).
      - if: runner.arch == 'X64'
        run: |
          qemu-img convert -c -O qcow2 -o compression_type=zstd disk.qcow2 vm.qcow2
          mv vm.qcow2 disk.qcow2
          sha256sum disk.qcow2 > disk.qcow2.sha256
      - if: runner.arch == 'X64'
        uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.variant }}
          path: |
            disk.qcow2
            disk.qcow2.sha256
          compression-level: 0
          retention-days: 1

  # Boot the same disks on the other hosts with hardware virtualization.
  # Budget: artifact download, one retried boot hang, smoke.sh's own timeout.
  smoke:
    needs: [setup, build]
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vm-${{ matrix.variant }}
          path: vm-${{ matrix.variant }}
      - name: Verify the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: test/fetch-artifact.sh "vm-$VARIANT"
      - if: runner.os == 'macOS'
        run: brew install qemu
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install -y --no-progress qemu
          echo 'C:\Program Files\qemu' >> "$GITHUB_PATH"
      - shell: bash
        env:
          SMOKE_INFERENCE: ${{ runner.os != 'macOS' && '1' || '0' }}
          VARIANT: ${{ matrix.variant }}
        run: test/smoke.sh "vm-$VARIANT/disk.qcow2" x86_64
      # The step above prints only the tail of the guest's console; smoke.sh
      # keeps one console and one qemu stderr log per boot attempt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.variant }}-${{ matrix.runner }}
          path: |
            serial.*.log
            qemu.*.log
          retention-days: 7

  # Every build and smoke test passed: publish both architectures to Docker Hub.
  push:
    needs: [setup, build, smoke]
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Free disk space, use the containerd image store
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-${{ matrix.variant }}-*
      - name: Verify the download
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: for arch in X64 ARM64; do test/fetch-artifact.sh "image-$VARIANT-$arch"; done
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - env:
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for arch in X64:x86_64 ARM64:aarch64; do
            docker load -i "image-$VARIANT-${arch%:*}/image.tar"
            docker tag "agenticlinux:$VARIANT" "$IMAGE:$VARIANT-$TAG-${arch#*:}"
            docker push "$IMAGE:$VARIANT-$TAG-${arch#*:}"
            docker rmi "agenticlinux:$VARIANT" "$IMAGE:$VARIANT-$TAG-${arch#*:}"
          done
          docker buildx imagetools create -t "$IMAGE:$VARIANT" -t "$IMAGE:$VARIANT-$TAG" \
            "$IMAGE:$VARIANT-$TAG-x86_64" "$IMAGE:$VARIANT-$TAG-aarch64"

  # GitHub Releases answers 500 now and then (an ISO upload has failed with
  # "Error saving asset" after 15 minutes of transfer, on eight of fourteen
  # ISOs in one run), so every call to it below is retried. The retries are
  # idempotent: create checks for the release first, upload clobbers.
  release:
    needs: [setup, push]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          NOTES: |
            Images: https://hub.docker.com/r/${{ vars.DOCKER_HUB_USER }}/agenticlinux/tags?name=${{ needs.setup.outputs.tag }}

            The ISOs are network installers that install the matching image from
            Docker Hub, so they need a network connection during install.
        run: |
          for i in $(seq 5); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes "$NOTES" && break
            [ "$i" -lt 5 ] || exit 1
            sleep 60
          done

  iso:
    needs: [setup, release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO
        # iso/build.sh runs in a container of the image's distribution: that
        # is where lorax and the network installer ISO come from
        env:
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ needs.setup.outputs.tag }}
          BUILDER: ${{ startsWith(matrix.variant, 'centos-') && format('quay.io/centos/centos:stream{0}', env.CENTOS) || format('fedora:{0}', env.FEDORA) }}
        run: |
          iso="agenticlinux-$VARIANT-$(uname -m).iso"
          for i in $(seq 12); do docker pull "$BUILDER" && break || sleep 20; done
          docker run --rm -v "$PWD:/w" -w /w -e REPO_URL "$BUILDER" \
            iso/build.sh "$IMAGE:$VARIANT-$TAG" "$VARIANT" "/w/$iso"
          sha256sum "$iso" > "$iso.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for i in $(seq 5); do
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber agenticlinux-* && break
            [ "$i" -lt 5 ] || exit 1
            sleep 60
          done

  publish:
    needs: [setup, iso]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for i in $(seq 5); do
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest && break
            [ "$i" -lt 5 ] || exit 1
            sleep 60
          done
