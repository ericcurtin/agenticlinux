name: Retry

# A hosted runner now and then dies mid-job ("lost communication with the
# server"), failing a Build run that is otherwise green. Re-run the failed jobs
# when that is the only kind of failure; anything else stays red.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      checks: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          LOST: lost communication with the server|received a shutdown signal
        run: |
          # Build's concurrency group would cancel a newer run for this re-run
          latest=$(gh run list --workflow build.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          [ "$latest" = "$RUN" ] || { echo "superseded by run $latest"; exit 0; }
          jobs=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"')
          [ -n "$jobs" ] || exit 0
          # Every failed job must have failed only by losing its runner
          while IFS=$'\t' read -r id name; do
            msgs=$(gh api --paginate "repos/$GH_REPO/check-runs/$id/annotations?per_page=100" \
              --jq '.[] | select(.annotation_level == "failure") | .message | gsub("\n"; " ")')
            echo "$name: ${msgs:-no failure annotation}"
            if [ -z "$msgs" ] || grep -vqE "$LOST" <<<"$msgs"; then
              echo "not a lost runner, not retrying"
              exit 0
            fi
          done <<<"$jobs"
          gh run rerun "$RUN" --failed
