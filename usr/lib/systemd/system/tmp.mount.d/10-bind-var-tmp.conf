# /tmp is /var/tmp bind-mounted over it, not a tmpfs. A tmpfs is capped at half
# of RAM and its pages are RAM, charged to whatever wrote them: a build that
# leaves gigabytes in /tmp (a cargo target directory, a Go build cache) fills
# it, and every write to /tmp after that, a program's log file among them,
# fails with ENOSPC (SIGBUS for a memory-mapped one, as for a linker's output).
# /var/tmp is on the root filesystem, so the two are one directory that RAM does
# not limit. nosuid and nodev are what the tmpfs had.
#
# A symlink would give the same directory, but the root is read-only: it could
# only be made in the image, and tmp.mount, which skips itself when /tmp is a
# symlink (ConditionPathIsSymbolicLink=!/tmp), is then the only thing that
# would have told a reader why /tmp is not a mount. This drop-in changes just
# what is mounted. systemd still orders the mount before local-fs.target and
# after whatever mounts /var/tmp, so RequiresMountsFor=/tmp in
# agenticlinux-bootguard-boot.service holds.
[Mount]
What=/var/tmp
Type=none
Options=bind,nosuid,nodev
