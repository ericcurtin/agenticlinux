# agenticlinux-bootguard: count boot attempts of a trial deployment. GRUB
# decrements bg_counter on every attempt and, at zero, boots entry 1 (the
# previous deployment). Userspace clears it once the new deployment is healthy.
insmod increment
if [ -n "${bg_counter}" ]; then
  if [ "${bg_counter}" = "0" -o "${bg_counter}" = "-1" ]; then
    set default=1
    set bg_counter=-1
  else
    decrement bg_counter
  fi
  save_env bg_counter
fi
