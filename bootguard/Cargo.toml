[package]
name = "agenticlinux-bootguard"
version = "0.1.0"
edition = "2021"
description = "Automatic rollback for failed bootc upgrades"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
