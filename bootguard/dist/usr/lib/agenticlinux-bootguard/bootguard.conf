# Defaults; override in /etc/agenticlinux-bootguard/bootguard.conf.
ENABLED=true
# Statically check a staged update before rebooting into it.
PREFLIGHT=true
# Boot attempts the new deployment gets before falling back.
MAX_ATTEMPTS=3
# Seconds a trial boot may take before the watchdog reboots.
TRIAL_TIMEOUT=600
# Seconds each health-check script may run before it is killed.
CHECK_TIMEOUT=120
# Space-separated units that must be active.
REQUIRED_UNITS=""
# Any failed unit fails the boot.
FAIL_ON_FAILED_UNITS=false
